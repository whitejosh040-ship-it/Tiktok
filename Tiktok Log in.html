  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #161823;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      text-align: center;
    }

    .demo {
      display: inline-block;
      background: #eee;
      color: #555;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input {
      width: 100%;
      height: 52px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      border-radius: 4px;
      padding: 0 15px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }

    .input:focus {
      border-color: #999;
      background: #fff;
    }

    .login {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 4px;
      background: #fe2c55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login:active {
      transform: scale(0.98);
    }

    .message {
      min-height: 24px;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 30px 0;
      color: #999;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #ddd;
      flex: 1;
    }

    .social {
      width: 100%;
      height: 48px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      margin-top: 35px;
      font-size: 11px;
      color: #999;
      line-height: 1.5;
    }
  </style>
</head>
